name: unit-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The cross-repository MLP-v1 contract check was removed on 2026-08-04. Licensing is out of
      # scope until 1.0, no backend is deployed, and the contract did not move to the new site repo,
      # so the step could only pass against a stale repository. The golden fixtures remain in
      # MiloKit and are still exercised by MLP1GoldenVectorTests in `swift test` below. Restore this
      # step, against whichever repository then holds the contract, when licensing resumes.
      - name: Test app package
        run: swift test
      - name: Test MiloKit package
        run: swift test --package-path Packages/MiloKit
