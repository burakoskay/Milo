name: mirror

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to secondary remote
        env:
          MIRROR_URL: ${{ secrets.MONOMACAW_INTERNAL_MIRROR_URL }}
        run: |
          test -n "$MIRROR_URL"
          git remote add mirror "$MIRROR_URL"
          git push --mirror mirror
