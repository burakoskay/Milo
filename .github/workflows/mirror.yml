name: mirror

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mirror main to secondary remote
        env:
          MIRROR_URL: ${{ secrets.MONOMACAW_INTERNAL_MIRROR_URL }}
        run: |
          test -n "$MIRROR_URL"
          git remote add mirror "$MIRROR_URL"
          git push --mirror mirror
