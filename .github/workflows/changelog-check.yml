name: changelog-check

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require changelog updates for product changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(App|Packages|Server|Milo)/'; then
            echo "$changed" | grep -qx 'CHANGELOG.md'
          fi
      - name: Require matching version section for tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \\[$version\\]" CHANGELOG.md
