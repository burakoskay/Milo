name: conventional-commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: |
          title="${{ github.event.pull_request.title }}"
          echo "$title" | grep -Eq '^(feat|fix|perf|refactor|security|build|docs|test|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
      - name: Validate commits on main
        if: github.event_name == 'push'
        run: |
          base="$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          git log --format=%s "$base"..HEAD | while read -r subject; do
            echo "$subject" | grep -Eq '^(feat|fix|perf|refactor|security|build|docs|test|ci|chore)(\([a-z0-9._-]+\))?!?: .+' || {
              echo "Non-conventional commit: $subject"
              exit 1
            }
          done
