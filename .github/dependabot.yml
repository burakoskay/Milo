version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/Packages/MiloKit"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      spm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
